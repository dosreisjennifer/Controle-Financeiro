<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3DAFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="icone.png">
<title>Finanças</title>
<style>
:root{--bg:#FBFAFD;--g1:#E3DAFB;--card:#fff;--in:#F4F1FB;--ink:#1F1B2E;--soft:#767190;--line:#EBE7F5;--pos:#2E7D5B;--neg:#C2415F;--c1:#E4DBFB;--c2:#E8EBA8;--pill:#ffffffcc;--sel:#1f1b2e12;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14111F;--g1:#2B2347;--card:#221D33;--in:#2C2640;--ink:#EEEAF8;--soft:#9A94B5;--line:#342D4B;--pos:#6FD1AE;--neg:#FF8FA5;--c1:#3A2F66;--c2:#3B4326;--pill:#2A2440d9;--sel:#ffffff1a}}
*{box-sizing:border-box}
html{background:var(--bg) linear-gradient(var(--g1),var(--bg) 560px) no-repeat}
body{margin:0;color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:12px 18px 170px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num,h1,.big,.strip b{font-family:ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
h1{font-size:2.5rem;font-weight:500;line-height:1.05;margin:0;text-transform:capitalize}
h1 small{font:.8rem system-ui,sans-serif;letter-spacing:.08em;color:var(--soft)}
.pill{border:1px solid var(--line);background:var(--pill);border-radius:999px;padding:12px 20px;font-weight:500;box-shadow:0 4px 14px #5b4a9a1f;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.strip{display:flex;gap:4px;margin-bottom:22px}
.strip button{flex:1;border:0;background:none;padding:8px 0 12px;border-radius:18px;display:grid;justify-items:center;color:var(--soft);position:relative}
.strip small{font-size:.7rem;letter-spacing:.06em}
.strip b{font-size:1.35rem;font-weight:400;text-transform:capitalize}
.strip .on{background:var(--sel);color:var(--ink)}
.strip .on::after{content:"";position:absolute;bottom:5px;width:26px;height:3px;border-radius:2px;background:var(--soft);opacity:.4}
.card{border-radius:26px;padding:22px;margin-bottom:14px}
.c1{background:var(--c1)}.c2{background:var(--c2)}
.card small{display:block;font-size:.8rem;opacity:.7}
.card p{margin:2px 0 0;font-size:.8rem;opacity:.75}
.big{font-size:2.6rem;line-height:1.1;margin:2px 0 16px;font-weight:500}
.c2 .big{font-size:1.9rem;margin-bottom:6px}
.tres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sh .num{font-size:.95rem;color:var(--soft)}
.all{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:22px;background:var(--sel);padding:8px 16px;margin-bottom:10px;text-align:left}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.r{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 16px;margin-bottom:10px;box-shadow:0 2px 10px #5b4a9a0f;text-align:left}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none}
.t{flex:1;min-width:0;text-align:left}
.t>span{display:block;font-weight:500;overflow-wrap:anywhere}
.t small{display:block;color:var(--soft);font-size:.8rem}
.nome{border:0;background:none;padding:0}
.v{white-space:nowrap}
.ck{width:34px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none;padding:0}
.ck i{width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);opacity:.55;display:grid;place-items:center;font-style:normal;font-size:.8rem;color:#fff}
.ck.ok i{background:var(--pos);border-color:var(--pos);opacity:1}
.ck.ok i::after{content:"✓"}
.feito .nome,.feito .v{opacity:.45}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.vazio{color:var(--soft);text-align:center;padding:40px 16px}
.imp{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:22px;background:var(--c1);padding:12px 16px;font-weight:500;text-align:left}
.imp .ic{background:#ffffff80}
.donut{width:210px;height:210px;border-radius:50%;margin:8px auto 22px;display:grid;place-items:center}
.donut div{width:130px;height:130px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--soft)}
.donut b{display:block;color:var(--ink);font-weight:500;font-size:1.05rem}
.lgb{width:100%;border:0}
.lgb em{font-style:normal;color:var(--soft)}
.lgb{scroll-margin-top:16px}
.donut{cursor:pointer;-webkit-tap-highlight-color:transparent}
.an{background:var(--card);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px #5b4a9a0f}
.an h4{margin:0 0 10px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:600}
.term{display:flex;align-items:baseline;gap:8px}
.term b{font:500 1.7rem ui-serif,"New York",Georgia,serif}
.term span{color:var(--soft);font-size:.85rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;border-radius:99px}
.an ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:.9rem}
.an li{display:flex;gap:8px}
.an li::before{content:"•";color:var(--soft)}
.det{background:var(--card);border-radius:22px;margin:-4px 0 10px;overflow:hidden}
.di{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 16px;text-align:left}
.di:first-child{border-top:0}
.di small{display:block;color:var(--soft);font-size:.8rem}
.di.feito{opacity:.5}
.cs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.cs button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--card);font-size:.85rem;font-weight:500}
.cs button.on{background:var(--ink);color:var(--bg)}
.cfg{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:22px;padding:16px;margin-bottom:10px}
.cfg.neg{color:var(--neg)}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(calc(100% - 28px),420px);display:flex;gap:4px;padding:8px;border-radius:999px;background:var(--pill);border:1px solid var(--line);box-shadow:0 10px 30px #5b4a9a2e;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:5}
#tabs button{flex:1;border:0;background:none;border-radius:999px;padding:12px 0;display:flex;justify-content:center;align-items:center;gap:6px;color:var(--soft);font-size:.75rem;font-weight:600;white-space:nowrap}
#tabs button.on{background:var(--sel);color:var(--ink);flex:2}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs span{display:none}#tabs .on span{display:inline}
dialog{border:0;border-radius:26px;padding:22px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
form{display:grid;gap:12px}
h3{margin:0;font-weight:500}
label{display:grid;gap:4px;font-size:.8rem;color:var(--soft)}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--in);font-size:16px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:1rem;color:var(--ink)}
.chk input{width:22px;height:22px;flex:none}
.dica{margin:0;font-size:.8rem;color:var(--soft)}
.acoes{display:flex;gap:10px}
.acoes button{flex:1;padding:13px;border:0;border-radius:999px;background:var(--in)}
.acoes .p{background:var(--ink);color:var(--bg);font-weight:500}
.acoes .ex{flex:none;background:none;color:var(--neg)}
#limp{display:grid;gap:12px;max-height:40vh;overflow:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header id="nav">
    <h1 id="tit"></h1>
    <button class="pill" id="novo">＋ Novo</button>
  </header>
  <b id="mes" hidden></b>
  <div class="strip" id="strip"></div>

  <section data-t="inicio">
    <div class="card c1">
      <small>Saldo</small>
      <div class="big num" id="saldo"></div>
      <div class="tres">
        <div><small>Entradas</small><span class="num" id="rec"></span></div>
        <div><small>A pagar</small><span class="num" id="pag"></span></div>
      </div>
    </div>
    <div class="card c2">
      <small>Previsão de <span id="pvm"></span></small>
      <div class="big num" id="pvv"></div>
      <p id="pvs"></p><p id="pvx"></p>
    </div>
    <div class="sh"><span class="chip" style="background:#9B8AE040">Resumo do mês</span></div>
    <div id="resumo"></div>
  </section>

  <section data-t="lanc">
    <button class="imp" id="ofx"><span class="ic">📥</span>Importar fatura do cartão</button><input type="file" id="arqo" hidden>
    <div id="lista"></div>
  </section>

  <section data-t="graf">
    <div class="donut" id="donut"><div><span>Total<b class="num" id="dtot"></b></span></div></div>
    <div id="analise"></div>
    <div id="leg"></div>
    <p class="dica" style="margin:10px 4px">Toque no gráfico ou numa categoria para ver os gastos dela; toque num gasto para editar. Não inclui entradas nem cofrinho.</p>
  </section>

  <section data-t="mais">
    <button class="cfg" id="exp">Salvar backup</button>
    <button class="cfg" id="imp">Restaurar backup</button>
    <button class="cfg neg" id="lim">Apagar tudo</button>
    <input type="file" id="arq" accept="application/json,.json" hidden>
    <p class="dica" style="margin:12px 4px">Seus dados ficam só neste aparelho e não são enviados a ninguém.</p>
  </section>
</main>

<div id="tabs">
  <button data-g="inicio" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
  <button data-g="lanc" aria-label="Lançamentos"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Lançamentos</span></button>
  <button data-g="graf" aria-label="Gráfico"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Gráfico</span></button>
  <button data-g="mais" aria-label="Mais"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg><span>Mais</span></button>
</div>

<dialog id="dlg">
  <form id="f">
    <h3 id="titulo"></h3>
    <label>Tipo
      <select id="tipo">
        <option value="entrada">Entrada</option>
        <option value="fixo">Despesa fixa</option>
        <option value="parcelado">Despesa parcelada</option>
        <option value="cartao">Cartão de crédito</option>
        <option value="variavel">Gasto variável</option>
        <option value="cofrinho">Cofrinho</option>
      </select>
    </label>
    <label>Nome<input id="nome" maxlength="60" autocomplete="off"></label>
    <label><span id="rv">Valor</span><input id="valor" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>
    <label id="catw">Categoria<select id="cat"></select></label>
    <label id="cartw" hidden>Cartão<select id="cartao"></select></label>
    <div class="par" id="parc" hidden>
      <label>Parcela deste mês<input id="atual" type="number" min="1" value="1" inputmode="numeric"></label>
      <label>Total de parcelas<input id="total" type="number" min="1" inputmode="numeric"></label>
    </div>
    <label class="chk" id="repw"><input type="checkbox" id="rep"> Repetir todo mês</label>
    <p class="dica" id="aviso" hidden></p>
    <div class="acoes">
      <button type="button" class="ex" id="del" hidden>Excluir</button>
      <button type="button" id="cancel">Cancelar</button>
      <button class="p">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dimp">
  <form id="fimp">
    <h3>Fatura do cartão</h3>
    <p class="dica" id="rimp"></p>
    <label>Mês em que a fatura será paga<input type="month" id="mimp"></label>
    <label>Cartão desta fatura<select id="cimps"></select></label>
    <div id="limp"></div>
    <div class="acoes"><button type="button" id="cimp">Cancelar</button><button class="p">Lançar selecionadas</button></div>
  </form>
</dialog>

<script>
const K="financas:v2",$=id=>document.getElementById(id);
const SEC=[["entrada","Entradas"],["fixo","Despesas fixas"],["parcelado","Despesas parceladas"],["cartao","Cartão de crédito"],["variavel","Variáveis"],["cofrinho","Cofrinho"]];
const CATS=[["Moradia","#5B8DEF","🏠"],["Contas","#8E9AAF","💡"],["Alimentação","#F2994A","🛒"],["iFood","#E5484D","🍔"],["Transporte","#9B72CF","🚗"],["Farmácia","#2FBF8F","💊"],["Saúde","#EB7BA5","🩺"],["Educação","#2D9CDB","📚"],["Assinaturas","#E3B23C","📺"],["Lazer","#B7C94B","🎉"],["Compras","#1F6F5C","🛍️"],["Dívida","#B5385C","💸"],["Cartão de crédito","#3F51B5","💳"],["Outros","#A1887F","✨"]];
const CE=Object.fromEntries(CATS.map(c=>[c[0],c[2]])),SN=Object.fromEntries(SEC);
const SC={entrada:"#4CAF8040",fixo:"#8E7CE040",parcelado:"#F2994A40",cartao:"#5B8DEF40",variavel:"#E3B23C40",cofrinho:"#E58BB540"};
const cor=c=>CC[c]||"#B8C4C2";
const ico=i=>i.tipo==="entrada"?["💰","#4CAF80"]:i.tipo==="cofrinho"?["🐷","#E58BB5"]:[CE[i.cat]||"🏷️",cor(i.cat||"")];
const CC=Object.fromEntries(CATS);
const KW=[["iFood",/ifood/],["Dívida",/renegoc|emprestimo|financiamento|divida|consignado|pendenc/],["Farmácia",/farm|drog|raia|pacheco|panvel|pague menos|venancio/],
["Assinaturas",/netflix|spotify|prime video|disney|hbo|\bmax\b|youtube|icloud|apple\.com|google|deezer|globoplay|assinatura/],
["Compras",/amazon|shopee|mercado ?livre|magalu|shein|americanas|renner|zara|aliexpress/],
["Alimentação",/rappi|restaur|mercado|market|padaria|lanch|burger|pizza|acai|atacad|carrefour|assai|cafe/],
["Transporte",/uber|\b99\b|posto|combust|ipiranga|estacion|pedagio|sem parar|metro|onibus/],
["Saúde",/clinica|hospital|medic|laborat|dentis|unimed|psic/],
["Educação",/curso|escola|facul|udemy|alura|livr/],
["Lazer",/cinema|ingresso|steam|playstation|viagem|hotel|airbnb|decolar|show/],
["Moradia",/condom|aluguel|leroy|casas bahia|imobili/],
["Contas",/enel|sabesp|claro|vivo|\btim\b|\boi\b|internet|energia|\bluz\b|agua/]];
const guess=n=>{const s=String(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const k=KW.find(([,r])=>r.test(s));return k?k[0]:""};
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const mi=m=>{const[a,b]=m.split("-");return a*12+ +b-1};
const fm=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const nmes=(m,o)=>{const[a,b]=m.split("-");return new Date(a,b-1,1).toLocaleDateString("pt-BR",o)};
const hoje=new Date();
let D=[],M=fm(hoje.getFullYear()*12+hoje.getMonth()),T="inicio",ed=null;
try{D=JSON.parse(localStorage.getItem(K))||[]}catch{}
D.forEach(i=>{if(i.tipo==="invest")i.tipo="cofrinho";if(i.tipo==="cartao"&&!i.cat)i.cat="Cartão de crédito"});
$("cat").innerHTML='<option value="">Sem categoria</option>'+CATS.map(([c])=>`<option>${c}</option>`).join("");

function num(s){s=s.replace(/[^\d.,]/g,"");
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,"");
  return parseFloat(s)}
const ativo=(i,m)=>{const x=mi(m),a=mi(i.ini);
  if(x<a||(i.fim&&x>mi(i.fim)))return false;
  if(i.tipo==="parcelado")return i.atual+x-a<=i.total;
  return i.rep||x===a};
const val=(i,m)=>(i.vig||[]).reduce((v,e)=>mi(e.de)<=mi(m)?e.valor:v,i.valor);
const soma=(m,f)=>D.filter(i=>ativo(i,m)&&f(i)).reduce((t,i)=>t+val(i,m),0);

function save(){
  try{localStorage.setItem(K,JSON.stringify(D))}catch{alert("Não foi possível salvar neste navegador.")}
  render()}

function render(){
  const y=M.slice(0,4);
  $("mes").textContent=nmes(M,{month:"long",year:"numeric"});
  $("tit").innerHTML=T==="mais"?"Mais":nmes(M,{month:"long"})+" <small>"+y+"</small>";
  $("strip").hidden=T==="mais";$("novo").hidden=T==="mais"||T==="graf";
  $("strip").innerHTML=[-2,-1,0,1,2].map(d=>{const m=fm(mi(M)+d);return `<button data-m="${m}" class="${d?"":"on"}"><small>${m.slice(0,4)}</small><b>${nmes(m,{month:"short"}).replace(".","")}</b></button>`}).join("");
  document.querySelectorAll("[data-t]").forEach(s=>s.hidden=s.dataset.t!==T);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.g===T));
  const L=D.filter(i=>ativo(i,M)),ent=i=>i.tipo==="entrada",pg=i=>!ent(i)&&i.pg&&i.pg[M];
  const s=f=>L.filter(f).reduce((t,i)=>t+val(i,M),0);
  const E=s(ent),S=s(i=>!ent(i)),pago=s(pg);
  $("saldo").textContent=brl(E-pago);$("saldo").style.color=E-pago<0?"var(--neg)":"";
  $("rec").textContent=brl(E);$("pag").textContent=brl(S-pago);

  // previsão do próximo mês
  const N=fm(mi(M)+1),ne=soma(N,ent),ns=soma(N,i=>!ent(i)&&i.tipo!=="cartao");
  const pv=ne-ns;
  $("pvm").textContent=nmes(N,{month:"long"});
  $("pvv").textContent=brl(pv);$("pvv").style.color=pv<0?"var(--neg)":"";
  $("pvs").textContent="Entradas "+brl(ne)+" · Saídas "+brl(ns);
  $("pvx").textContent="Não inclui o cartão de crédito.";

  // resumo (início): fixas, parceladas e cartão
  $("resumo").innerHTML=[["fixo","📌","#8E7CE0"],["parcelado","🧾","#F2994A"],["cartao","💳","#5B8DEF"]].map(([t,e,c])=>{
    const it=L.filter(i=>i.tipo===t);
    return it.length?`<button class="r lgb" data-r="${t}"><span class="ic" style="background:${c}33">${e}</span><span class="t"><span>${SN[t]}</span><small>${it.length} ${it.length>1?"lançamentos":"lançamento"}</small></span><span class="num neg">${brl(it.reduce((a,i)=>a+val(i,M),0))}</span><em>${OR===t?"▾":"▸"}</em></button>`+
      (OR===t?`<div class="det">`+it.slice().sort((a,b)=>val(b,M)-val(a,M)).map(i=>{
        const sub=[t==="parcelado"?`${+i.atual+mi(M)-mi(i.ini)} de ${+i.total}`:"",t==="cartao"?i.cartao||"":"",t==="cartao"&&i.cartao&&i.cat==="Cartão de crédito"?"":i.cat||""].filter(Boolean).join(" · ");
        return `<button class="di ${pg(i)?"feito":""}" data-e="${esc(i.id)}"><span>${esc(i.nome)}${sub?`<small>${esc(sub)}</small>`:""}</span><b class="num neg">${brl(val(i,M))}</b></button>`}).join("")+`</div>`:""):""}).join("")||`<p class="vazio">Nada neste mês.</p>`;

  // lançamentos
  const cs=cartoes(),nsem=L.filter(i=>i.tipo==="cartao"&&!i.cartao).length;
  if(CF&&CF!=="__sem"&&!cs.includes(CF)||CF==="__sem"&&!nsem)CF="";
  const chips=t=>t!=="cartao"?"":(cs.length?`<div class="cs">`+[["","Todos"],...cs.map(c=>[c,c]),...(nsem?[["__sem","Sem cartão"]]:[])].map(([v,l])=>`<button data-cf="${esc(v)}" class="${CF===v?"on":""}">${esc(l)}</button>`).join("")+`</div>`:"")+(nsem?`<button class="all" data-d="1"><span class="t"><span>Definir o cartão dos lançamentos sem cartão</span><small>${nsem} ${nsem>1?"lançamentos":"lançamento"}</small></span></button>`:"");
  let pool=pago;
  const h=SEC.map(([t,n])=>{
    const all=L.filter(i=>i.tipo===t);if(!all.length)return"";const it=all.filter(cf);
    const fc=FC[t];
    return `<div class="sh"><button class="chip" data-s="${t}" style="background:${SC[t]}">${n} (${it.length}) ${fc?"▸":"▾"}</button><span class="num">${brl(t==="entrada"?E-pago:it.reduce((a,i)=>a+val(i,M),0))}</span></div>`+(!fc?chips(t):"")+(!fc&&(t==="parcelado"||t==="cartao")?`<button class="all" data-a="${t}"><span class="t"><span>Marcar todas como pagas</span><small>${it.filter(i=>pg(i)).length} de ${it.length} pagas</small></span><span class="ck ${it.every(i=>pg(i))?"ok":""}"><i></i></span></button>`:"")+(fc?"":it.map(i=>{
      let rv=val(i,M);if(t==="entrada"){const u=i===it[it.length-1]?pool:Math.min(pool,rv);rv-=u;pool-=u}
      const sub=[t==="parcelado"?`${+i.atual+mi(M)-mi(i.ini)} de ${+i.total}`:"",t==="entrada"&&rv!==val(i,M)?"de "+brl(val(i,M)):"",t==="cartao"?i.cartao||"":"",t==="cartao"&&i.cartao&&i.cat==="Cartão de crédito"?"":i.cat||""].filter(Boolean).join(" · "),ic=ico(i);
      return `<div class="r ${pg(i)?"feito":""}"><span class="ic" style="background:${ic[1]}33">${ic[0]}</span>
        <button class="nome t" data-e="${esc(i.id)}"><span>${esc(i.nome)}</span>${sub?`<small>${esc(sub)}</small>`:""}</button>
        <span class="v num ${t==="entrada"&&rv>=0?"pos":"neg"}">${brl(rv)}</span>
        ${t==="entrada"?"":`<button class="ck ${pg(i)?"ok":""}" data-k="${esc(i.id)}" aria-label="Marcar como pago"><i></i></button>`}</div>`}).join(""))}).join("");
  $("lista").innerHTML=h||`<p class="vazio">Nada neste mês.<br>Toque em ＋ Novo para adicionar.</p>`;

  // gráfico por categoria (toque abre os gastos)
  const G={};
  L.filter(i=>!ent(i)&&i.tipo!=="cofrinho").forEach(i=>{const c=i.cat||"Sem categoria";(G[c]=G[c]||{v:0,it:[]}).v+=val(i,M);G[c].it.push(i)});
  const A=Object.entries(G).sort((a,b)=>b[1].v-a[1].v),TT=A.reduce((t,a)=>t+a[1].v,0);
  let ac=0;
  DA=[];const cg=A.map(([c,g])=>{const a=ac/TT*100;ac+=g.v;DA.push([c,a/100,ac/TT]);const k=OP&&G[OP]&&c!==OP?cor(c)+"66":cor(c);return `${k} ${a}% ${ac/TT*100}%`}).join(",");
  $("donut").style.background=TT?`conic-gradient(${cg})`:"var(--line)";
  const sel=OP&&G[OP];$("dtot").previousSibling.textContent=sel?OP:"Total";$("dtot").textContent=brl(sel?G[OP].v:TT);
  $("leg").innerHTML=A.length?A.map(([c,g])=>{
    const op=OP===c,n=g.it.length;
    return `<button class="r lgb" data-c="${esc(c)}"><span class="ic" style="background:${cor(c)}33">${CE[c]||"🏷️"}</span><span class="t"><span>${esc(c)}</span><small>${n} ${n>1?"lançamentos":"lançamento"} · ${Math.round(g.v/TT*100)}%</small></span><b class="num">${brl(g.v)}</b><em>${op?"▾":"▸"}</em></button>`+
    (op?`<div class="det">`+g.it.sort((a,b)=>val(b,M)-val(a,M)).map(i=>`<button class="di" data-e="${esc(i.id)}"><span>${esc(i.nome)}<small>${SN[i.tipo]}${i.tipo==="parcelado"?" · "+(+i.atual+mi(M)-mi(i.ini))+" de "+(+i.total):""}</small></span><b class="num neg">${brl(val(i,M))}</b></button>`).join("")+`</div>`:"")}).join(""):`<p class="vazio">Sem gastos neste mês.</p>`;

  // análise do mês (enxuta)
  const cart=s(i=>i.tipo==="cartao"),parc=s(i=>i.tipo==="parcelado"),dv=s(i=>!ent(i)&&i.cat==="Dívida"),semc=L.filter(i=>!ent(i)&&i.tipo!=="cofrinho"&&!i.cat).length;
  const pct=E>0?Math.round(TT/E*100):0,pc=(v,t)=>E>0&&v/E>=t,al=[];
  if(!E)al.push("Nenhuma entrada lançada neste mês.");
  else if(TT>E)al.push("Os gastos passam da renda em "+brl(TT-E)+".");
  if(pc(cart,.3))al.push("Cartão de crédito consome "+Math.round(cart/E*100)+"% da renda.");
  if(pc(parc,.25))al.push("Parcelas comprometem "+Math.round(parc/E*100)+"% da renda.");
  if(pc(dv,.1))al.push("Dívida pesa "+Math.round(dv/E*100)+"% da renda.");
  if(ne>0&&pv<0)al.push("Previsão de "+nmes(N,{month:"long"})+" fica negativa em "+brl(-pv)+" (sem o cartão).");
  if(semc>=3)al.push(semc+" lançamentos sem categoria deixam a análise incompleta.");
  const pa=L.filter(i=>i.tipo==="parcelado"),cl=pct<=60?"#4CAF80":pct<=85?"#E3B23C":"#E5484D",rot=pct<=60?"folgado":pct<=85?"atenção":"apertado";
  const fimP=pa.length?"Parcelas: "+brl(parc)+"/mês; a última termina em "+nmes(fm(Math.max(...pa.map(i=>mi(M)+(+i.total-(+i.atual+mi(M)-mi(i.ini)))))),{month:"long",year:"numeric"})+".":"";
  $("analise").innerHTML=TT||E?`<div class="an"><h4>Análise do mês</h4>`+(E?`<div class="term"><b>${pct}%</b><span>da renda comprometida · ${rot}</span></div><div class="bar"><i style="width:${Math.min(pct,100)}%;background:${cl}"></i></div>`:"")+`<ul>${(al.length?al.slice(0,3):["Nada preocupante neste mês."]).concat(fimP?[fimP]:[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
}

$("tabs").onclick=e=>{const b=e.target.closest("[data-g]");if(b){T=b.dataset.g;scrollTo(0,0);render()}};
$("lista").onclick=e=>{
  const k=e.target.closest("[data-k]"),b=e.target.closest("[data-e]");
  if(k){const i=D.find(x=>x.id===k.dataset.k);i.pg=i.pg||{};
    if(i.pg[M])delete i.pg[M];else i.pg[M]=1;save()}
  else if(b)abrir(D.find(x=>x.id===b.dataset.e))};

function campos(){
  const t=$("tipo").value,p=t==="parcelado",r=["entrada","fixo","cofrinho"].includes(t);
  $("parc").hidden=!p||!!ed;$("repw").hidden=!r||!!ed;
  $("catw").hidden=t==="entrada"||t==="cofrinho";
  $("cartw").hidden=t!=="cartao";
  if(!ed&&t==="cartao"&&!$("cat").value)$("cat").value="Cartão de crédito";
  $("rv").textContent=p?"Valor da parcela":"Valor";
  if(!ed&&r)$("rep").checked=t!=="cofrinho"}

function abrir(i){
  ed=i||null;
  $("titulo").textContent=i?"Editar":"Novo lançamento";
  $("tipo").value=i?i.tipo:"variavel";$("tipo").disabled=!!i;
  $("nome").value=i?i.nome:"";
  $("valor").value=i?String(val(i,M)).replace(".",","):"";
  $("cat").value=i&&i.cat&&CC[i.cat]?i.cat:"";
  fillCard($("cartao"),i?i.cartao:(CF&&CF!=="__sem"?CF:""));
  $("atual").value=1;$("total").value="";
  $("del").hidden=!i;
  const rec=i&&(i.rep||i.tipo==="parcelado");
  $("aviso").hidden=!rec;
  if(rec)$("aviso").textContent="O novo valor vale de "+$("mes").textContent+" em diante. Os meses anteriores não mudam.";
  campos();$("dlg").showModal()}

$("f").onsubmit=e=>{
  e.preventDefault();
  const nome=$("nome").value.trim(),v=num($("valor").value),cat=$("catw").hidden?"":($("cat").value||($("tipo").value==="cartao"?"Cartão de crédito":""));
  if(!nome||!(v>0))return alert("Informe um nome e um valor maior que zero.");
  if(ed){
    ed.nome=nome;ed.cat=cat;if(ed.tipo==="cartao")ed.cartao=$("cartao").value;
    if(ed.rep||ed.tipo==="parcelado"){
      ed.vig=(ed.vig||[]).filter(x=>x.de!==M);ed.vig.push({de:M,valor:v});
      ed.vig.sort((a,b)=>mi(a.de)-mi(b.de))}
    else ed.valor=v}
  else{
    const t=$("tipo").value,a=parseInt($("atual").value)||1,tot=parseInt($("total").value)||0;
    if(t==="parcelado"&&tot<a)return alert("O total de parcelas deve ser igual ou maior que a parcela deste mês.");
    D.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:t,nome,valor:v,ini:M,cat,
      rep:$("repw").hidden?false:$("rep").checked,atual:a,total:tot,vig:[],pg:{},cartao:t==="cartao"?$("cartao").value:""})}
  $("dlg").close();save()};

$("del").onclick=()=>{
  const rec=ed.rep||ed.tipo==="parcelado";
  if(!confirm(rec?`Remover "${ed.nome}" de ${$("mes").textContent} em diante? Os meses anteriores continuam.`:`Excluir "${ed.nome}"?`))return;
  if(rec&&mi(ed.ini)<mi(M))ed.fim=fm(mi(M)-1);else D=D.filter(x=>x!==ed);
  $("dlg").close();save()};

$("novo").onclick=()=>abrir();
$("tipo").onchange=campos;
$("cancel").onclick=()=>$("dlg").close();

$("exp").onclick=async()=>{
  const f=new File([JSON.stringify(D)],"financas-backup.json",{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f]})}catch{return}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()};
$("imp").onclick=()=>$("arq").click();
$("arq").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(Array.isArray(d))d.forEach(i=>{if(i&&i.tipo==="invest")i.tipo="cofrinho"});
    const ok=i=>i&&SEC.some(s=>s[0]===i.tipo)&&/^\d{4}-\d\d$/.test(i.ini)&&Number.isFinite(i.valor)&&typeof i.nome==="string"&&typeof i.id==="string";
    if(!Array.isArray(d)||!d.every(ok))throw 0;
    if(confirm("Substituir os dados atuais pelo backup?")){D=d;save()}
  }catch{alert("Arquivo de backup inválido.")}};
$("lim").onclick=()=>{if(confirm("Apagar todos os dados deste aparelho? Isso não pode ser desfeito.")){D=[];save()}};

// importação da fatura: parceladas -> "Despesas parceladas"; o resto -> "Cartão de crédito"
let PI=[];
const dupl=(p,f)=>p.c
  ?D.some(x=>x.tipo==="cartao"&&x.ini===f&&x.valor===p.v&&(!x.cartao||x.cartao===$("cimps").value)&&String(x.nome).toLowerCase()===p.nome.toLowerCase())
  :D.some(x=>x.tipo==="parcelado"&&String(x.nome).toLowerCase()===p.nome.toLowerCase()&&+x.total===p.tot&&+x.atual+mi(f)-mi(x.ini)===p.at);
function listaImp(){
  const f=$("mimp").value||M;
  $("limp").innerHTML=PI.map((p,k)=>{
    const d=dupl(p,f);
    return `<label class="chk"><input type="checkbox" data-i="${k}" ${d?"disabled":"checked"}><span>${esc(p.nome)}${p.c?"":` ${p.at}/${p.tot}`} · ${brl(p.v)}<br><small>${p.c?"Cartão":"Parcelada"}${p.cat?" · "+esc(p.cat):""}${d?" (já lançada)":""}</small></span></label>`}).join("")}
$("ofx").onclick=()=>$("arqo").click();
$("mimp").onchange=listaImp;
$("cimp").onclick=()=>$("dimp").close();
$("arqo").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const b=await f.arrayBuffer();let t;
    try{t=new TextDecoder("utf-8",{fatal:true}).decode(b)}catch{t=new TextDecoder("windows-1252").decode(b)}
    const g=(s,k)=>{const r=s.match(new RegExp("<"+k+">([^<\\r\\n]*)"));return r?r[1].trim():""};
    const tr=[...t.matchAll(/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>)/g)].map(m=>m[1]);
    PI=[];
    tr.forEach(s=>{
      const v=parseFloat(g(s,"TRNAMT")),memo=(g(s,"MEMO")||g(s,"NAME")).replace(/&amp;/g,"&");
      if(!(v<0)||!memo||/pagamento (recebido|efetuado)/i.test(memo))return;
      const m=memo.match(/^(.*?)\s*-\s*(?:parcela\s*)?(\d+)\s*\/\s*(\d+)$/i);
      const at=m&&+m[2],tot=m&&+m[3];
      if(m&&m[1]&&at>=1&&at<=tot&&tot<=60)PI.push({nome:m[1].trim(),v:-v,at,tot,cat:guess(m[1])});
      else PI.push({nome:memo,v:-v,c:1,cat:"Cartão de crédito"})});
    if(!PI.length)return alert("Não encontrei lançamentos neste arquivo.");
    const fim=g(t,"DTEND");
    $("mimp").value=/^\d{6}/.test(fim)?fim.slice(0,4)+"-"+fim.slice(4,6):M;
    const np=PI.filter(p=>!p.c).length;
    $("rimp").textContent=np+" parceladas e "+(PI.length-np)+" gastos no cartão. As categorias foram sugeridas pelo nome; você pode ajustar depois.";
    fillCard($("cimps"),cartoes().length===1?cartoes()[0]:"");listaImp();$("dimp").showModal();
  }catch{alert("Não consegui ler este arquivo. Use o arquivo .ofx baixado do banco.")}};
$("fimp").onsubmit=e=>{
  e.preventDefault();
  const f=$("mimp").value||M;let n=0;
  $("limp").querySelectorAll("input:checked").forEach(c=>{
    const p=PI[c.dataset.i];
    D.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:p.c?"cartao":"parcelado",nome:p.nome,valor:p.v,ini:f,cat:p.cat||"",rep:false,atual:p.c?1:p.at,total:p.c?0:p.tot,vig:[],pg:{},cartao:p.c?$("cimps").value:""});n++});
  $("dimp").close();
  if(n){M=f;T="lanc";save()}};

let OP="",OR="",FC={},CF="",DA=[];
$("donut").onclick=e=>{
  const r=$("donut").getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy);
  if(d>r.width/2)return;
  if(d<r.width*.31){OP="";render();return}
  let a=Math.atan2(dx,-dy);if(a<0)a+=2*Math.PI;
  const f=a/(2*Math.PI),x=DA.find(z=>f>=z[1]&&f<z[2]);
  if(!x)return;
  OP=OP===x[0]?"":x[0];render();
  if(OP){const el=[...$("leg").querySelectorAll("[data-c]")].find(b=>b.dataset.c===OP);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}};
const cf=i=>i.tipo!=="cartao"||!CF||(CF==="__sem"?!i.cartao:i.cartao===CF);
const CK="financas:cartoes";let EX=[];try{EX=JSON.parse(localStorage.getItem(CK))||[]}catch{}
const cartoes=()=>[...new Set([...D.map(i=>i.cartao).filter(Boolean),...EX])].sort((a,b)=>a.localeCompare(b,"pt-BR"));
function addCard(n){if(!cartoes().includes(n)){EX.push(n);try{localStorage.setItem(CK,JSON.stringify(EX))}catch{}}}
function fillCard(sel,v){
  sel.innerHTML='<option value="">Sem cartão definido</option>'+cartoes().map(c=>`<option>${esc(c)}</option>`).join("")+'<option value="__novo">＋ Novo cartão…</option>';
  sel.value=v||"";if(sel.value!==(v||""))sel.value="";sel.dataset.p=sel.value}
["cartao","cimps"].forEach(id=>$(id).onchange=function(){
  if(this.value==="__novo"){const n=(prompt("Nome do cartão (ex.: Nubank, Itaú Visa)")||"").trim().slice(0,30);
    if(n){addCard(n);fillCard(this,n)}else this.value=this.dataset.p||""}
  else this.dataset.p=this.value;
  if(id==="cimps")listaImp()});
$("resumo").onclick=e=>{
  const b=e.target.closest("[data-e]"),r=e.target.closest("[data-r]");
  if(b)abrir(D.find(x=>x.id===b.dataset.e));
  else if(r){OR=OR===r.dataset.r?"":r.dataset.r;render()}};
$("strip").onclick=e=>{const b=e.target.closest("[data-m]");if(b){M=b.dataset.m;render()}};
$("leg").onclick=e=>{
  const b=e.target.closest("[data-e]"),c=e.target.closest("[data-c]");
  if(b)abrir(D.find(x=>x.id===b.dataset.e));
  else if(c){OP=OP===c.dataset.c?"":c.dataset.c;render()}};
$("lista").addEventListener("click",e=>{
  const b=e.target.closest("[data-s]"),a=e.target.closest("[data-a]"),f=e.target.closest("[data-cf]"),d=e.target.closest("[data-d]");
  if(b){FC[b.dataset.s]=!FC[b.dataset.s];render()}
  else if(f){CF=f.dataset.cf;render()}
  else if(d){const sem=D.filter(i=>i.tipo==="cartao"&&ativo(i,M)&&!i.cartao);
    const n=(prompt("Qual cartão para os "+sem.length+" lançamentos sem cartão? Ex.: Nubank")||"").trim().slice(0,30);
    if(n){addCard(n);sem.forEach(i=>i.cartao=n);save()}}
  else if(a){const it=D.filter(i=>i.tipo===a.dataset.a&&ativo(i,M)&&cf(i)),todos=it.every(i=>i.pg&&i.pg[M]);
    it.forEach(i=>{i.pg=i.pg||{};if(todos)delete i.pg[M];else i.pg[M]=1});save()}});

render();
</script>
